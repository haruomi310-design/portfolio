<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Carousel</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      background: #000;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      width: 100%;
    }

    .carousel-slide {
      position: relative;
      min-width: 100%;
      flex: 0 0 100%;
    }

    .carousel-slide img {
      display: block;
      width: 100%;
      height: 420px;
      object-fit: cover;
      filter: brightness(0.85);
    }

    .slide-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 28px 24px 24px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      color: #fff;
    }

    .slide-caption h3 {
      margin: 0 0 8px;
      font-size: clamp(20px, 2vw, 28px);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .slide-caption p {
      margin: 0;
      font-size: 14px;
      color: #d5d5d5;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: #111;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.32);
      transform: translateY(-50%) scale(1.04);
    }

    .prev-btn {
      left: 18px;
    }

    .next-btn {
      right: 18px;
    }

    .dots-container {
      position: absolute;
      right: 24px;
      bottom: 18px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      width: 26px;
      background: #ffffff;
      border-radius: 999px;
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
      }

      .carousel-slide img {
        height: 330px;
      }

      .nav-btn {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <!--
    Google Sites向けの埋め込みページです。
    このファイルを公開用サーバーに置いて、そのURLをGoogle Sitesの「埋め込み」で使ってください。
  -->
  <div class="carousel-wrapper">
    <button class="nav-btn prev-btn" type="button" aria-label="前の画像" onclick="moveSlide(-1)">&#10094;</button>
    <button class="nav-btn next-btn" type="button" aria-label="次の画像" onclick="moveSlide(1)">&#10095;</button>

    <div class="dots-container" id="dotsContainer" aria-label="スライド選択"></div>

    <div class="carousel-track" id="track">
      <div class="carousel-slide">
        <img src="media/3062c3a78182fa32.PNG" alt="Creative Design">
        <div class="slide-caption">
          <h3>Creative Design</h3>
          <p>洗練されたモダンなクリエイティブデザイン</p>
        </div>
      </div>

      <div class="carousel-slide">
        <img src="media/wood.PNG" alt="Future Tech">
        <div class="slide-caption">
          <h3>Future Tech</h3>
          <p>次世代のテクノロジーとイノベーション</p>
        </div>
      </div>

      <div class="carousel-slide">
        <img src="media/3062c3a78182fa32.PNG" alt="Minimal Art">
        <div class="slide-caption">
          <h3>Minimal Art</h3>
          <p>無駄を削ぎ落としたミニマルな世界観</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const track = document.getElementById('track');
    const slides = Array.from(track.children);
    const dotsContainer = document.getElementById('dotsContainer');

    let currentIndex = 0;
    let autoPlayTimer;

    slides.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (index === 0) dot.classList.add('active');
      dot.addEventListener('click', () => jumpToSlide(index));
      dotsContainer.appendChild(dot);
    });

    const dots = Array.from(dotsContainer.children);

    function updateCarousel() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
      });
    }

    function moveSlide(direction) {
      currentIndex += direction;
      if (currentIndex >= slides.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = slides.length - 1;
      updateCarousel();
      resetTimer();
    }

    function jumpToSlide(index) {
      currentIndex = index;
      updateCarousel();
      resetTimer();
    }

    function startTimer() {
      autoPlayTimer = setInterval(() => {
        moveSlide(1);
      }, 4000);
    }

    function resetTimer() {
      clearInterval(autoPlayTimer);
      startTimer();
    }

    startTimer();
  </script>
</body>
</html>
